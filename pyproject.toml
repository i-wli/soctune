[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-soc-xtb"
version = "0.1.0"
description = "Config-driven periodic spin–orbit scaling for GFN1-xTB in DFTB+."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "ase==3.26.0",
  "matplotlib==3.10.5",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "scipy==1.15.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]
dft = [
  "gpaw==25.7.0",
  "gpaw-data==1.0.1",
]

[tool.setuptools]
packages = ["ml_soc_xtb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "dft_integration: opt-in smoke tests that launch electronic-structure backends",
]
